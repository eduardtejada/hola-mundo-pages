<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Hola Mundo! | Despliegue Automático</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0f1d;
      --bg-card: rgba(255, 255, 255, 0.05);
      --border-card: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --accent-purple: #818cf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.8) 0px, transparent 100%);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 3.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 1.25rem;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent) 70%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.15rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      font-size: 1rem;
      transition: all 0.2s ease;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-purple));
      color: #040914;
      border: none;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }

    .btn:hover {
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>¡Hola Mundo!</h1>
    
    <p class="subtitle">
      Página web desplegada automáticamente en la nube. Cualquier cambio enviado al repositorio de GitHub se refleja de forma instantánea.
    </p>

    <div>
      <a href="https://github.com/eduardtejada/hola-mundo-pages" target="_blank" class="btn" id="repo-link">
        Ver Repositorio
      </a>
    </div>
  </div>

</body>
</html>
